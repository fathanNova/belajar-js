<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Tipe Data Number</title>
    </head>
    <body>
        
        <script>
            /*  Pada Js, tipe data number hanya ada satu, yaitu number yang dapat menyimpan bilangan bulat maupun bilangan desimal.
            Js juga mendukung number notation seperti hexadecimal, octal, dan binary.
            Binary "0b", Octal "0o", Hexadecimal "0x"
            */
            document.writeln(100);
            document.writeln("</br>");
            document.writeln(3.14);
            document.writeln("</br>");
            document.writeln("Binary: " + 0b1010); // 10 in binary
            document.writeln("</br>");
            document.writeln("Octal: " + 0o777); // 511 in decimal
            document.writeln("</br>");
            document.writeln("Hexadecimal: " + 0xFF); // 255 in decimal
        </script>
    </body>
