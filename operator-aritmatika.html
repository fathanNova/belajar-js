<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Operator Aritmatika</title>
    </head>
    <body>
        <script>

            let hasil = 10 + 5;
            document.writeln("<p>10 + 5 = " + hasil + "</p>"); // Operator penjumlahan
            let hasilAkhir = hasil;

            hasil = hasil ** 2;
            document.writeln("<p>" + hasilAkhir+ " ** 2 = " + hasil + "</p>"); // Operator exponensial
            hasilAkhir = hasil;

            hasil = hasil -1;
            document.writeln("<p>" + hasilAkhir + " - 1 = " + hasil + "</p>"); // Operator pengurangan
            hasilAkhir = hasil;

            hasil = hasil * 2;
            document.writeln("<p>" + hasilAkhir + " * 2 = " + hasil + "</p>"); // Operator perkalian
            hasilAkhir = hasil;

            hasil = hasil / 3;
            document.writeln("<p>" + hasilAkhir + " / 3 = " + hasil + "</p>"); // Operator pembagian
            hasilAkhir = hasil;

            hasil = hasil % 2;
            document.writeln("<p>" + hasilAkhir + " % 2 = " + hasil + "</p>"); // Operator modulus (sisa bagi)
            hasilAkhir = hasil;

            document.writeln("<p>Menggunakan Operator Augmented Assignment</p>");
            let a = 5;
            a += 3; // Sama dengan a = a + 3
            document.writeln("<p>5 += 3 = " + a + "</p>");

        </script>
    </body>
</html>
