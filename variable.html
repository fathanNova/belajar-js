<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Variable</title>
    </head>
    <body>
        <script>
            /*  Kata kunci var digantikan dengan let. Berfungsi sama dan data pada variable dapat diubah-ubah. ECMAScript 2015
                Kata kunci const digunakan untuk mendeklarasikan variable yang nilainya tidak dapat diubah (konstanta).
            */
            let fullName;
            fullName = "Fathan Nova Arroyan";
            document.writeln(fullName);
            document.writeln("</br>");
            const univ = "Universitas Amikom Yogyakarta";
            document.writeln(univ);
        </script>
    </body>
