<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Escape Sequence</title>
    </head>
    <body>
        <script>
            // Textarea digunakan untuk menampilkan teks dengan format tertentu, seperti newline, tab, dan lain-lain.
            document.writeln("<textarea cols='100' rows='10'>");
            document.writeln("Fathan \nNova Arroyan");
            document.writeln("Universitas \tAmikom");
            document.writeln("\"Info\"rmatika");
            document.writeln("Semester \'4\'");
            document.writeln("Fathan \\ Nova");
            document.writeln("</textarea>");
        </script>
    </body>
