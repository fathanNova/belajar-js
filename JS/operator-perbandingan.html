<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Operator Perbandingan</title>
    </head>
    <body>
        <script>
           let hasil = 5 == "5"; 
           document.writeln("<p>5 == '5': " + hasil + "</p>");

           hasil = 5 === "5";
           document.writeln("<p>5 === '5': " + hasil + "</p>");

           hasil = 5 != "5";
              document.writeln("<p>5 != '5': " + hasil + "</p>");

            hasil = 5 !== "5";
            document.writeln("<p>5 !== '5': " + hasil + "</p>");

        </script>
    </body>
