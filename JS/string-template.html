<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    
    <title>String Template</title>
</head>
<body>
    <script>
        let name = "Nova";
        const value = 81;

        let message = `Nama saya ${name} dan saya lulus ${value > 75}`;
        document.writeln(message);

        let multiline = `
Nama saya Fathan Nova Arroyan
Saat ini sedang belajar Javascript
Saya sangat senang belajar Javascript
        `
        document.writeln("<pre>")
        document.writeln(multiline)
        document.writeln("</pre>")

    </script>
</body>
</html>
